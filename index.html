<!DOCTYPE html>

<html>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/css/xterm.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/kursor/dist/kursor.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        #window, #notesUi, #terminalUi {
            width: min(500px, calc(100vw - 32px)) !important;
        }

        #notesUi > div:last-child,
        #terminalUi > div:last-child {
            width: 100% !important;
            margin: 6px 0 !important;
        }

        #terminal,
        #terminal .xterm {
            width: 100%;
            height: 100%;
        }
    </style>
<body style="background-image: url(https://user-cdn.hackclub-assets.com/019f950a-cc49-7339-b54f-06ba7a92c868/beautiful-pc-wallpaper-hd.png); background-size: cover; height: 100vh;">
    <div style="display: flex; background-color: rgba(0, 0, 0, 0.25); color: #fff; backdrop-filter: blur(10px); border-radius: 30px; justify-content: space-between; " id="top"> 
        <p style="margin-left: 16px; cursor: pointer;" id="welcomeopen">

            OKATA-OS

        </p>
        
        <p style="margin-right: 16%;" id="Time">

            6/21/2026 3:14 PM

        </p>

    </div>
    
  <div style="border: solid; width: 228px; padding: 16px;  position:absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; border-radius: 30px; width: 500px;" id="window">
    <div id="welcomeheader" style="width: 100%; display: flex; justify-content: flex-start; backdrop-filter: blur(10px);">
     
        <p style=" cursor: pointer; background-color: red; padding: 5px; border: 1px solid #000000; border-radius: 100%; width: auto; display: flex; justify-content: flex-start; " id="closeBtn">X</p>

    </div>
    <h1>OKATA-OS</h1>
    <h2>Welcome</h2>

  </div>

  <div id ="desktopApps" style="padding-top: 64px; padding-left:16px ">
   <div  id="notesIcon" style="text-align: center; padding: 16px; filter: drop-shadow(0px 0px 8px black); width: fit-content" class="selected">
    <img src="./notes.png" style="width: 64px; height: 64px; height: 64px; border-radius: 5px;  background-color: rgba(246, 240, 240, 0.1); backdrop-filter: blur(10px); cursor: pointer;" id="notesApp">
    <p style="margin: 0px; color: #fff;">Notes</p>
   </div>

   <div id="confitti-icon" style="text-align: center; padding: 16px; filter: drop-shadow(0px 0px 8px black); width: fit-content" class="selected">
    <img src="./confetti.jpg" style="width: 64px; height: 64px; height: 64px; border-radius: 5px;  background-color: rgba(246, 240, 240, 0.1); backdrop-filter: blur(10px); cursor: pointer;" id="confittiApp">
    <p style="margin: 0px; color: #fff;">Confitti</p>
   </div>
   <div id="terminal-icon" style="text-align: center; padding: 16px; filter: drop-shadow(0px 0px 8px black); width: fit-content" class="selected">
    <img src="./terminal.png" style="width: 64px; height: 64px; height: 64px; border-radius: 5px;  background-color: rgba(246, 240, 240, 0.1); backdrop-filter: blur(10px); cursor: pointer;" id="terminalApp">
    <p style="margin: 0px; color: #fff;">Terminal</p>
   </div>
  <div id="calculator-icon" style="text-align: center; padding: 16px; filter: drop-shadow(0px 0px 8px black); width: fit-content" class="selected">
    <img src="./calculator.png" style="width: 64px; height: 64px; height: 64px; border-radius: 5px;  background-color: rgba(246, 240, 240, 0.1); backdrop-filter: blur(10px); cursor: pointer;" id="calculatorApp">
    <p style="margin: 0px; color: #fff;">Calculator</p>
   </div>

 

  <div style="display: none; border: solid; width: 500px; padding: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; border-radius: 30px;" id="notesUi">
    <div id="notesheader" style="width: 100%; display: flex; justify-content: flex-start;">
        <p style="cursor: pointer; background-color: red; padding: 5px; border: 1px solid #000000; border-radius: 100%;" id="notescloseBtn">X</p>
        <p class="headertext">Notes</p>
    </div>
    <div style="width: 100%; height: 480px; padding: 16px; margin: 6px 0; border-radius: 12px;">
        <div id="quill-editor"></div>
    </div>
  </div>

  <div style="display: none; border: solid; width: 500px; padding: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; border-radius: 30px;" id="terminalUi">
    <div id="terminalheader" style="width: 100%; display: flex; justify-content: flex-start;">
        <p style="cursor: pointer; background-color: red; padding: 5px; border: 1px solid #000000; border-radius: 100%;" id="terminalcloseBtn">X</p>
        <p class="headertext">Terminal</p>
    </div>
    <div style="width: 100%; height: 480px; padding: 16px; margin: 6px 0; border-radius: 12px; background-color: #111;">
        <div id="terminal" style="height: 100%; width: 100%;"></div>
    </div>
    </div>

      <div style="display: none; border: solid; width: 1000px; padding: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; border-radius: 30px;" id="calculatorUI">
    <div id="calculatorheader" style="width: 100%; display: flex; justify-content: flex-start;">
        <p style="cursor: pointer; background-color: red; padding: 5px; border: 1px solid #000000; border-radius: 100%;" id="calculatorcloseBtn">X</p>
        <p class="headertext" style="height: 100px; width:200px">Calculator</p>
    </div>
      <div id="calculator" style="width: 100%; height: 480px; padding: 16px; margin: 6px 0; border-radius: 12px;">

      <div class="calculator__output" id="display">0</div>
      <!--Take from cssacademy.com-->
      <button class="calculator__key calculator__key--operator" onclick="appendOperator('+')">+</button>
      <button class="calculator__key calculator__key--operator" onclick="appendOperator('-')">-</button>
      <button class="calculator__key calculator__key--operator" onclick="appendOperator('*')">*</button>
      <button class="calculator__key calculator__key--operator" onclick="appendOperator('/')">÷</button>
      <button class="calculator__key"  onclick="appendNumber('7')">7</button>
      <button class="calculator__key" onclick="appendNumber('8')">8</button>
      <button class="calculator__key" onclick="appendNumber('9')">9</button>
      <button class="calculator__key" onclick="appendNumber('4')">4</button>
      <button class="calculator__key" onclick="appendNumber('5')">5</button>
      <button class="calculator__key" onclick="appendNumber('6')">6</button>
      <button class="calculator__key" onclick="appendNumber('1')">1</button>
      <button class="calculator__key" onclick="appendNumber('2')">2</button>
      <button class="calculator__key" onclick="appendNumber('3')">3</button>
      <button class="calculator__key" onclick="appendNumber('0')">0</button>
      <button class="calculator__key" onclick="appendNumber('.')">.</button>
      <button class="calculator__key" onclick="clearDisplay()">AC</button>
      <button class="calculator__key calculator__key--enter" onclick="calculate()">=</button>

      </div>       
    </div>

  </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.3.0/lib/xterm.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.js"></script>

<script src="https://unpkg.com/kursor"></script>
<script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
<script>
    new kursor({
    type: 4,
    color: '#27EEF5',
    removeDefaultCursor: true,
    clickEffect: true,
    effectSize: 5,
    effectDuration: 0.5
    })
</script>
<script src="script.js"></script> 
</html>
